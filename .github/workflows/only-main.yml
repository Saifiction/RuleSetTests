
name: Only main can merge

on:
  pull_request:
    branches:
      - release

permissions:
  contents: read

jobs:
  check-source:
    name: only-main-source
    runs-on: ubuntu-latest
    steps:
      - name: Reject PRs not from main
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$SOURCE_BRANCH" != "main" ]; then
            echo "Only PRs from main can merge into release."
            exit 1
          fi
   
